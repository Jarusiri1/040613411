<html><head><meta charset="utf-8">
    <script>
        var xmlHttp;
    
        function send() {
            xmlHttp = new XMLHttpRequest();
            xmlHttp.onreadystatechange = showResult;
    
            var mango = document.getElementById("mango").value;
            var orange = document.getElementById("orange").value;
            var banana = document.getElementById("banana").value;
            var url= "cal.php?a=" + mango + "&b=" + orange + "&c=" + banana;
           
           xmlHttp.open("GET", url);
           xmlHttp.send();   
       }
       function showResult() {
           if (xmlHttp.readyState == 4 && xmlHttp.status == 200) {
               document.getElementById("result").innerHTML = xmlHttp.responseText;
           }
       }
    </script></head>
    <body>
        <h1>บันทึกการขาย</h1>
            มะม่วง กก.ละ 30 บาท ขายได้  <input type="number" id="mango" onkeyup="send()"> กก.<br>
            ส้ม กก.ละ 70 บาท ขายได้ <input type="number" id="orange" onkeyup="send()"> กก.<br>
            กล้วย กก.ละ 30 บาท ขายได้ <input type="number" id="banana" onkeyup="send()"> หวี<br><br>
         <span id="result"></span>
    </body></html>
