<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายชื่อโรงพยาบาลเอกชนในกรุงเทพฯ</title>
</head>
<body>
    <h1>รายชื่อโรงพยาบาลเอกชนในกรุงเทพฯ</h1>
    <ul id="hospital-list"></ul>

    <script>
        async function fetchHospitalData() {
            try {
                // ดึงข้อมูลจาก URL ที่ให้มา
                let response = await fetch('http://202.44.40.193/~aws/JSON/priv_hos.json');
                let data = await response.json(); // แปลงข้อมูลเป็น JSON

                // ดึง element ที่จะใช้แสดงผล
                const hospitalList = document.getElementById('hospital-list');

                // วนลูปแสดงข้อมูลโรงพยาบาล
                data.features.forEach(hospital => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <strong>ชื่อโรงพยาบาล:</strong> ${hospital.properties.name} <br>
                        <strong>จำนวนเตียง:</strong> ${hospital.properties.num_bed} เตียง
                    `;
                    hospitalList.appendChild(li);
                });
            } catch (error) {
                console.error('Error fetching hospital data:', error);
            }
        }

        // เรียกใช้ฟังก์ชันเพื่อดึงข้อมูลเมื่อเปิดหน้าเว็บ
        fetchHospitalData();
    </script>
</body>
</html>
