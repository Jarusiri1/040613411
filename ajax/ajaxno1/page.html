<html><head><meta charset="utf-8">
    <script>
        var xmlHttp;
    
        function send() {
            xmlHttp = new XMLHttpRequest();
            xmlHttp.onreadystatechange = showResult;
    
            var mango = document.getElementById("a").value;
            var orange = document.getElementById("b").value;
            var banana = document.getElementById("c").value;
            var url= "cal.php?a=" + mango + "&b=" + orange + "&c" + banana;
           
           xmlHttp.open("GET", url);
           xmlHttp.send();   
       }
       function showResult() {
           if (xmlHttp.readyState == 4 && xmlHttp.status == 200) {
               document.getElementById("result").innerHTML = xmlHttp.responseText;
           }
       }
    </script></head>
    <body>
        <h2>บันทึกการขาย</h2>
        มะม่วง กก.ละ 30 บาท ขายได้<input type="number" id="a" onkeyup="send()"><br>
        ส้ม กก.ละ 70 บาท ขายได้<input type="number" id="b" onkeyup="send()"><br>
        กล้วย หวีละ 30 บาท ขายได้<input type="number" id="c" onkeyup="send()"><br>
         <span id="result"></span>
    </body></html>
</html>
