<!DOCTYPE html>
<html>
    <head>
        <meta charset = 'utf-8'>
    </head>
    <body>
        <form action = "../form-echo.php" method="get">
        USERNAME :
        <input
            type="text"
            name="username"
            placeholder="USERNAME"
            pattern="[A-Z]*"
            required
            ><br>
        <br><label>สาขาวิชา</label>

        <select name="dept" required>
            <option value="">--Please choose an option--</option>
            <option value="CS">CS</option>
            <option value="IC">IC</option>
            <option value="MA">MA</option>
            <option value="IMI">IMI</option>
            <option value="AS">AS</option>
            <option value="AFET">AFET</option>
        </select><br>
        <br><label>รหัสนักศึกษา</label>
        <input
            type="text"
            name="รหัสนักศึกษา"
            placeholder="xx-xxxxxx-xxxx-x"
            pattern="[0-9]{2}-[0-9]{6}-[0-9]{4}-[0-9]{1}"
            required
            ><br>
        <br><label>บ้านเลขที่:</label>
        <input
            type="text"
            name="บ้านเลขที่"
            placeholder="Ex.235/4"
            pattern="([0-9]*)/([0-9]*)"
            required
            >
        <br><br><label>รหัสสินค้า:</label>
        <input
            type="text"
            name="รหัสสินค้า"
            placeholder="AAA89"
            pattern="[A-Z]{3}[0-9]{2}"
            required
            >
        <br><br><label>ชื่อ-สกุล:</label>
        <input 
            type="text"
            name="ชื่อ-สกุล"
            placeholder="เฉพาะภาษาไทย"
            pattern="[\u0E00-\u0E7F]*"
            required
            >
            <p><input type="submit" value="submit"></p>
    </form>
    </body>
</html>
